name: Bug 报告
description: 报告可复现的软件、接口或计算问题
title: "[Bug] "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: 问题描述
      description: 实际发生了什么？
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤
      description: 包含输入问题、API 请求或最小代码，以及使用的模型和后端。
      placeholder: |
        1. 启动……
        2. 输入……
        3. 观察到……
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 预期行为
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: 环境
      placeholder: Windows 11, Python 3.12, Node 22, commit SHA
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: 日志与验证证据
      description: 请删除 API Key、Authorization header 和其他敏感信息。
  - type: checkboxes
    id: safety
    attributes:
      label: 提交前确认
      options:
        - label: 我确认内容中不含 API Key、`.env` 或其他密钥
          required: true
        - label: 我已搜索现有 Issues，未发现重复问题
          required: true
