[build-system]
requires = ["setuptools==75.8.0", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "thermoequi-agent"
version = "0.1.0"
description = "Knowledge-grounded and physically verified phase-equilibrium agent"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.6",
  "httpx==0.28.1",
  "numpy==2.1.3",
  "pandas==2.3.3",
  "pydantic==2.10.3",
  "pydantic-settings==2.6.1",
  "PyYAML==6.0.2",
  "scipy==1.15.3",
  "SQLAlchemy==2.0.39",
  "uvicorn[standard]==0.34.0",
]

[project.optional-dependencies]
dev = [
  "mypy==1.14.1",
  "pytest==8.3.4",
  "pytest-asyncio==0.25.2",
  "pytest-cov==6.0.0",
  "ruff==0.9.3",
]

[project.scripts]
thermoequi = "thermo_engine.cli:main"

[tool.setuptools.packages.find]
include = ["agent*", "apps*", "database*", "schemas*", "thermo_engine*"]

[tool.pytest.ini_options]
addopts = "-q --strict-markers -p no:cacheprovider"
testpaths = ["tests", "evals"]
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests", "evals"]

[[tool.mypy.overrides]]
module = ["scipy.*", "yaml"]
ignore_missing_imports = true
